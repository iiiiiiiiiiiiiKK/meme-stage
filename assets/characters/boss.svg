<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none">
  <!-- MEME STAGE original character: 老板 -->
  <g stroke="#0A0A0F" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- suit -->
    <path d="M104 800 C104 648 176 580 300 580 C424 580 496 648 496 800 Z" fill="#20202C"/>
    <!-- shirt -->
    <path d="M226 588 L300 700 L374 588 L340 572 L300 626 L260 572 Z" fill="#F4F1E8"/>
    <!-- tie -->
    <path d="M300 626 L330 672 L300 770 L270 672 Z" fill="#FF4D9D"/>
    <!-- neck -->
    <path d="M262 540 L262 596 L338 596 L338 540 Z" fill="#E8A87C"/>
    <!-- head -->
    <rect x="148" y="176" width="304" height="368" rx="60" fill="#E8A87C"/>
    <!-- comb-over -->
    <path d="M152 248 C176 150 424 150 448 248 C420 210 300 196 152 248 Z" fill="#4A2C17"/>
    <path d="M196 210 C236 182 364 182 404 210" stroke="#0A0A0F" stroke-width="8" fill="none"/>
    <!-- angry brows -->
    <path d="M196 330 L268 348" stroke="#0A0A0F" stroke-width="16"/>
    <path d="M404 330 L332 348" stroke="#0A0A0F" stroke-width="16"/>
    <!-- eyes -->
    <ellipse cx="238" cy="382" rx="24" ry="26" fill="#F4F1E8"/>
    <ellipse cx="362" cy="382" rx="24" ry="26" fill="#F4F1E8"/>
    <circle cx="242" cy="386" r="10" fill="#0A0A0F"/>
    <circle cx="358" cy="386" r="10" fill="#0A0A0F"/>
    <!-- frown -->
    <path d="M250 490 C278 462 322 462 350 490" stroke="#0A0A0F" stroke-width="14" fill="none"/>
    <!-- glasses? no, stress lines -->
    <path d="M170 400 L146 392 M430 400 L454 392" stroke="#0A0A0F" stroke-width="8"/>
    <!-- coffee mug -->
    <rect x="452" y="640" width="110" height="110" rx="18" fill="#F4F1E8"/>
    <path d="M562 668 C596 668 596 722 562 722" stroke="#0A0A0F" stroke-width="14" fill="none"/>
    <path d="M470 676 C480 646 500 646 510 676" stroke="#FF4D9D" stroke-width="10" fill="none"/>
  </g>
</svg>
